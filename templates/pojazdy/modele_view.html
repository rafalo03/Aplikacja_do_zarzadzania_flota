<h1 class="page-title">Modele pojazdów</h1>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>Wszystkie modele ({{ modele.count }})</h3>
        <a href="{% url 'dodaj_model' %}" class="btn btn-primary">+ Dodaj model</a>
    </div>
    <table class="table" id="tabela-modele">
        <thead>
            <tr>
                <th>Marka</th>
                <th>Model</th>
                <th>Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for model in modele %}
            <tr>
                <td>{{ model.marka }}</td>
                <td>{{ model.nazwa }}</td>
                <td><a href="#" class="btn btn-primary" style="font-size: 12px; padding: 4px 10px;">Edytuj</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align: center; color: var(--text-muted);">Brak modeli</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>initTabela({ tableId: 'tabela-modele', tabela: 'modele' });</script>
