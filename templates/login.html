{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logowanie – Aplikacja Flotowa</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', sans-serif;
            background: #ffffff;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            margin: 20px;
            border-radius: 20px;
            background: #26232f;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 24px 55px rgba(30, 27, 40, 0.35);
            overflow: hidden;
        }

        .login-header {
            padding: 26px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .login-header h1 {
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #e9ebf2;
        }

        .login-body { padding: 34px 36px 38px; }

        .login-error {
            background: rgba(239, 68, 68, 0.14);
            border: 1px solid rgba(239, 68, 68, 0.45);
            color: #f6a5a5;
            border-radius: 8px;
            padding: 9px 12px;
            font-size: 12.5px;
            margin-bottom: 20px;
        }

        .pole {
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.22);
            transition: border-color 0.2s;
            margin-bottom: 28px;
        }

        .pole:focus-within { border-color: rgba(255, 255, 255, 0.6); }

        .pole svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            color: rgba(255, 255, 255, 0.45);
        }

        .pole input {
            flex: 1;
            min-width: 0;
            padding: 12px 2px;
            background: transparent;
            border: none;
            outline: none;
            color: #f2f3f7;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .pole input::placeholder { color: rgba(255, 255, 255, 0.38); }

        .pole input:-webkit-autofill,
        .pole input:-webkit-autofill:hover,
        .pole input:-webkit-autofill:focus {
            -webkit-text-fill-color: #f2f3f7;
            -webkit-box-shadow: 0 0 0 1000px rgba(28, 26, 38, 0.9) inset;
            transition: background-color 9999s ease-in-out 0s;
        }

        .opcje {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 12.5px;
        }

        .zapamietaj {
            display: flex;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.65);
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
        }

        .zapamietaj input {
            width: 14px;
            height: 14px;
            accent-color: #7c5cbf;
            cursor: pointer;
        }

        .pomoc {
            color: rgba(255, 255, 255, 0.4);
            font-style: italic;
            cursor: help;
        }

        .login-btn {
            display: block;
            margin: 0 auto;
            min-width: 65%;
            padding: 13px 30px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.14);
            background: rgba(255, 255, 255, 0.10);
            color: #e9ebf2;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .login-btn:hover { background: rgba(255, 255, 255, 0.18); }
        .login-btn:active { transform: scale(0.98); }
        .login-btn:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.6); outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <h1>Aplikacja Flotowa</h1>
        </div>
        <div class="login-body">
            {% if form.errors %}
            <div class="login-error">Nieprawidłowa nazwa użytkownika lub hasło.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ next }}">
                <div class="pole">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                    <input type="text" name="username" id="id_username" placeholder="Nazwa użytkownika" aria-label="Nazwa użytkownika" autocomplete="username" autofocus required>
                </div>
                <div class="pole">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <input type="password" name="password" id="id_password" placeholder="Hasło" aria-label="Hasło" autocomplete="current-password" required>
                </div>
                <div class="opcje">
                    <label class="zapamietaj">
                        <input type="checkbox" name="remember_me" checked>
                        Zapamiętaj mnie
                    </label>
                    <span class="pomoc" title="Skontaktuj się z administratorem, aby zresetować hasło">Nie pamiętasz hasła?</span>
                </div>
                <button type="submit" class="login-btn">Zaloguj</button>
            </form>
        </div>
    </div>
</body>
</html>
