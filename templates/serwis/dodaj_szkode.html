{% extends 'base.html' %}
{% block title %}Dodaj szkodę{% endblock %}
{% block content %}
<h1 class="page-title">Dodaj szkodę blacharską</h1>
<div class="card">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}<p class="form-error">{{ field.errors }}</p>{% endif %}
            </div>
            {% endfor %}
        </div>
        <div style="margin-top: 20px; display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">Zapisz</button>
            <a href="{% url 'szkody' %}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
