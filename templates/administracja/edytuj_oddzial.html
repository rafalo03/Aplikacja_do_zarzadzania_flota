{% extends 'base.html' %}
{% block title %}Edytuj oddział{% endblock %}
{% block content %}
<h1 class="page-title">Edytuj oddział — {{ oddzial.nazwa }}</h1>
<div class="card" style="max-width: 640px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-grid">
            {% for field in form %}
            <div class="form-group{% if field.name == 'adres' %} pelna{% endif %}">
                <label>{{ field.label }}{% if field.field.required %} <span class="wymagane">*</span>{% endif %}</label>
                {{ field }}
                {% if field.errors %}<p class="form-error">{{ field.errors.0 }}</p>{% endif %}
            </div>
            {% endfor %}
        </div>
        <div style="margin-top: 20px; display: flex; gap: 12px;">
            <button type="submit" class="btn btn-primary">Zapisz zmiany</button>
            <a href="{% url 'oddzialy' %}" class="btn btn-secondary">Anuluj</a>
        </div>
    </form>
</div>
{% endblock %}
