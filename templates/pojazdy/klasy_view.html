<h1 class="page-title">Klasy pojazdów</h1>
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3>Wszystkie klasy ({{ klasy.count }})</h3>
        <a href="{% url 'dodaj_klase' %}" class="btn btn-primary">+ Dodaj klasę</a>
    </div>
    <table class="table" id="tabela-klasy">
        <thead>
            <tr>
                <th>Nazwa</th>
                <th>Opis</th>
                <th>Akcje</th>
            </tr>
        </thead>
        <tbody>
            {% for klasa in klasy %}
            <tr data-id="{{ klasa.id }}">
                <td>{{ klasa.nazwa }}</td>
                <td>{{ klasa.opis|default:"-" }}</td>
                <td><a href="{% url 'edytuj_klase' klasa.id %}" class="btn btn-primary" style="font-size: 12px; padding: 4px 10px;">Edytuj</a></td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align: center; color: var(--text-muted);">Brak klas</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<script>initTabela({ tableId: 'tabela-klasy', tabela: 'klasy', akcje: [
    { label: 'Szczegóły', url: '/klasy/{id}/' },
    { label: 'Edytuj', url: '/klasy/{id}/edytuj/' }
] });</script>
